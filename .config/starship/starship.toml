"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os$username$directory$git_branch$git_status$cmd_duration$line_break$character"""

right_format = """
$nodejs$python$rust$golang$java$kotlin$ruby$php$docker_context$time"""

add_newline = true

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vicmd_symbol = '[❮](bold yellow)'

[directory]
style = 'bold fg:cyan'
format = '[ $path ]($style)[$read_only]($read_only_style) '
truncation_length = 4
truncation_symbol = '…/'
truncate_to_repo = true
read_only = ' '
read_only_style = 'red'

[directory.substitutions]
'Documents' = '󰈙 '
'Downloads' = ' '
'Music' = '󰝚 '
'Pictures' = ' '
'Developer' = '󰲋 '

[git_branch]
symbol = ''
style = 'bold purple'
format = 'on [$symbol $branch]($style) '

[git_status]
style = 'bold yellow'
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = '='
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
up_to_date = ''
untracked = '?${count}'
stashed = '\$'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

[cmd_duration]
min_time = 2_000
style = 'bold yellow'
format = 'took [$duration]($style) '

[time]
disabled = false
time_format = '%H:%M'
style = 'bold white'
format = '[  $time ]($style)'

[nodejs]
symbol = ' '
format = '[$symbol($version )]($style)'

[python]
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[rust]
symbol = ' '
format = '[$symbol($version )]($style)'

[golang]
symbol = ' '
format = '[$symbol($version )]($style)'

[java]
symbol = ' '
format = '[$symbol($version )]($style)'

[kotlin]
symbol = ' '
format = '[$symbol($version )]($style)'

[ruby]
symbol = ' '
format = '[$symbol($version )]($style)'

[php]
symbol = ' '
format = '[$symbol($version )]($style)'

[docker_context]
symbol = ' '
format = '[$symbol$context]($style) '

[os]
disabled = false
style = 'bold fg:green'
format = '[$symbol ]($style)'

[os.symbols]
Macos = ''

[username]
show_always = true
style_user = 'bold fg:green'
style_root = 'bold fg:red'
format = '[$user]($style) '
